# 动作层封装
# extends 相对于当前配置文件；配置由 runtime.configuration 读取，约定在提交后检测。
# 基础字段、return_self() 和基础检测规则沿用父配置，不重复声明。

[layer]
type    = "active"
version = 1
name    = "动作层"
class   = "models.layers.active:ActiveLayer"
extends = "base.toml"
objects = "active"
when    = "组织动作资源或动作数据，使用 bind 说明其作用对象"

[layer.constraint]
overlap = true                # 允许对象在轴上的区间重叠，不控制显隐

[layer.display]
visibility = true             # 默认允许显隐控制

# 空层创建参数示例；向 objects 放入对应的对象实例。
[layer.example]
name    = "角色动作"
axis    = { unit = "秒", precision = 0.001 }
objects = []
