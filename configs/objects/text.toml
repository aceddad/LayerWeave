# 文字对象封装
# extends 相对于当前配置文件；读取器展开父配置并保留固定约定。
# 基础字段、return_self() 和基础检测规则沿用父配置，不重复声明。

[object]
type    = "text"                      # 对象配置名称
version = 1                           # 这份配置的版本
name    = "文字对象"                  # 封装显示名；实例名字创建时另传
class   = "models.objects.text:Text"  # 对应的 Python 类
extends = "base.toml"                  # 对应 Object 的基础配置
note    = "用 information.text 承载文本"
open    = true                        # 沿用基础约定，information 可保留附加内容

# 供 AI 阅读及后续检测代码使用；Python 类本身不执行检测。
# 声明字段缺失和类型错误分别诊断，等级由 ../logging/diagnostics.toml 控制；不增加长度或非空限制。
[object.information]
text = { type = "str", note = "文本内容，长度不限，可以是空字符串" }

[object.constraint]
duration = "any"                      # 可以有时长，也可以表示瞬间

[object.display]
visibility = true                     # 允许视图提供显隐控制

# 创建参数示例，假设已存在编号为 1 的文字层。
# 创建后由调用方将这个 Text 实例放入该层的 objects。
[object.example]
name        = "开场说明"
layer       = 1
begin       = 0.0
end         = 5.0
information = { text = "这一段表现角色从犹豫到行动。" }
