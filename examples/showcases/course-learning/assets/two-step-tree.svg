<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc"><title id="title">两步生成树：贪心不保证整段概率最大</title><desc id="desc">第一步甲0.6、乙0.4；甲后x0.51/y0.49，乙后x0.9/y0.1；四路径0.306/0.294/0.36/0.04。贪心甲x，最大乘积乙x。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17243c}.title{font-size:34px;font-weight:700}.sub{font-size:20px;fill:#56647a}.body{font-size:23px}.small{font-size:19px}.bold{font-weight:700}</style>
<rect width="1280" height="800" fill="#f5f7fc"/>
<text x="48" y="60" class="title">两步生成树</text>
<text x="48" y="96" class="sub">E2 · 原创教学设定 · 固定生成两个 token 后外部停止</text>
<text x="48" y="138" class="small">每条路径：第一步概率 × 给定第一步后的第二步概率</text>
<rect x="48" y="190" width="1184" height="444" rx="18" fill="white"/>
<path d="M220,405 L455,290" stroke="#6655d8" stroke-width="4" fill="none"/>
<path d="M220,405 L455,505" stroke="#00806c" stroke-width="4" fill="none"/>
<path d="M595,290 L835,232" stroke="#6655d8" stroke-width="4" fill="none"/>
<path d="M595,290 L835,347" stroke="#8a95a8" stroke-width="4" fill="none"/>
<path d="M595,505 L835,462" stroke="#00806c" stroke-width="4" fill="none"/>
<path d="M595,505 L835,577" stroke="#8a95a8" stroke-width="4" fill="none"/>
<rect x="85" y="370" width="135" height="70" rx="12" fill="#e8edf7"/>
<rect x="455" y="255" width="140" height="70" rx="12" fill="#eeeaff"/>
<rect x="455" y="470" width="140" height="70" rx="12" fill="#e4f6f0"/>
<text x="104" y="414" class="body">提示 h</text>
<text x="484" y="299" class="body">h, 甲</text>
<text x="484" y="514" class="body">h, 乙</text>
<text x="291" y="309" class="body">甲 0.6</text>
<text x="291" y="515" class="body">乙 0.4</text>
<text x="686" y="219" class="small">x  0.51</text>
<text x="686" y="335" class="small">y  0.49</text>
<text x="686" y="450" class="small">x  0.9</text>
<text x="686" y="566" class="small">y  0.1</text>
<text x="862" y="242" class="body bold" style="fill:#6655d8">甲x = 0.306</text>
<text x="1065" y="242" class="small" style="fill:#6655d8">贪心选中</text>
<text x="862" y="357" class="body bold" style="fill:#56647a">甲y = 0.294</text>
<text x="862" y="472" class="body bold" style="fill:#00806c">乙x = 0.360</text>
<text x="1065" y="472" class="small" style="fill:#00806c">整段最大</text>
<text x="862" y="587" class="body bold" style="fill:#56647a">乙y = 0.040</text>
<text x="62" y="682" class="body bold">0.306 + 0.294 + 0.360 + 0.040 = 1</text>
<text x="62" y="723" class="body">贪心先选 0.6，但 0.4 × 0.9 &gt; 0.6 × 0.51。</text>
<text x="62" y="766" class="small">图中为模型路径概率；确定性贪心在此设定下产生“甲x”的概率为 1。</text>
</svg>