<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1400" width="2400" height="1400">
  <defs>
    <!-- 四幕统一天空渐变：顶 #2B3A55 / 中 #3E5A7A / 底 #F2E8D5 -->
    <linearGradient id="s1-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A55"/>
      <stop offset="0.55" stop-color="#3E5A7A"/>
      <stop offset="1" stop-color="#F2E8D5"/>
    </linearGradient>

    <!-- 顶部薄云，左右淡出到透明 -->
    <linearGradient id="s1-cloud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4B6384" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#4B6384" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#4B6384" stop-opacity="0.42"/>
      <stop offset="0.8" stop-color="#4B6384" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4B6384" stop-opacity="0"/>
    </linearGradient>

    <!-- 地平线雾气，左右淡出到透明 -->
    <linearGradient id="s1-mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2E8D5" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#F2E8D5" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#F2E8D5" stop-opacity="0.55"/>
      <stop offset="0.78" stop-color="#F2E8D5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F2E8D5" stop-opacity="0"/>
    </linearGradient>

    <!-- 花苞背后的一团暖光（呼吸） -->
    <radialGradient id="s1-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2E8D5" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#F2E8D5" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#F2E8D5" stop-opacity="0"/>
    </radialGradient>

    <!-- 地面湿润的柔和暗部 -->
    <radialGradient id="s1-wet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E7D9BD" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#E7D9BD" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#E7D9BD" stop-opacity="0"/>
    </radialGradient>

    <!-- 花苞：蓝 #6FA8DC 的明暗 -->
    <linearGradient id="s1-budgrad" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#568CBC"/>
      <stop offset="0.55" stop-color="#6FA8DC"/>
      <stop offset="1" stop-color="#8FBEE4"/>
    </linearGradient>

    <!-- 春叶：春色 #A8C686 -->
    <linearGradient id="s1-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8FB26B"/>
      <stop offset="1" stop-color="#A8C686"/>
    </linearGradient>

    <!-- 雨场横向淡出：左右各 120px 渐变到透明，避免长卷拼接时雨被硬切断 -->
    <linearGradient id="s1-rainfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.05" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.95" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="s1-rainmask" maskUnits="userSpaceOnUse" x="0" y="0" width="2400" height="1400">
      <rect x="0" y="0" width="2400" height="1400" fill="url(#s1-rainfade)"/>
    </mask>

    <!-- 雨场：600 高一格，整体平移 600 后与自身重合，8s 无缝循环 -->
    <g id="s1-rainfield" fill="none" stroke="#C9DCEB" stroke-linecap="round">
      <path d="M30 100 L54 230" stroke-width="1.8" opacity="0.26"/>
      <path d="M84 320 L106 440" stroke-width="1.6" opacity="0.22"/>
      <path d="M138 500 L160 620" stroke-width="1.8" opacity="0.24"/>
      <path d="M180 40 L204 160" stroke-width="2" opacity="0.32"/>
      <path d="M318 150 L338 250" stroke-width="1.6" opacity="0.24"/>
      <path d="M462 20 L488 160" stroke-width="2.2" opacity="0.36"/>
      <path d="M600 210 L622 320" stroke-width="1.8" opacity="0.26"/>
      <path d="M748 80 L772 210" stroke-width="2" opacity="0.3"/>
      <path d="M890 250 L910 345" stroke-width="1.6" opacity="0.22"/>
      <path d="M1032 40 L1058 165" stroke-width="2.2" opacity="0.34"/>
      <path d="M1176 290 L1198 395" stroke-width="1.8" opacity="0.26"/>
      <path d="M1320 120 L1344 255" stroke-width="2" opacity="0.3"/>
      <path d="M1454 340 L1474 440" stroke-width="1.6" opacity="0.22"/>
      <path d="M1600 60 L1626 180" stroke-width="2.2" opacity="0.34"/>
      <path d="M1742 280 L1764 390" stroke-width="1.8" opacity="0.26"/>
      <path d="M1886 150 L1910 280" stroke-width="2" opacity="0.3"/>
      <path d="M2028 20 L2048 115" stroke-width="1.6" opacity="0.24"/>
      <path d="M2168 200 L2194 340" stroke-width="2.2" opacity="0.34"/>
      <path d="M2280 90 L2300 195" stroke-width="1.6" opacity="0.24"/>
      <path d="M250 380 L272 500" stroke-width="1.8" opacity="0.28"/>
      <path d="M392 480 L416 590" stroke-width="2" opacity="0.3"/>
      <path d="M536 340 L556 440" stroke-width="1.6" opacity="0.22"/>
      <path d="M680 520 L706 660" stroke-width="2.2" opacity="0.34"/>
      <path d="M824 400 L846 505" stroke-width="1.8" opacity="0.26"/>
      <path d="M966 540 L986 635" stroke-width="1.6" opacity="0.22"/>
      <path d="M1110 360 L1134 490" stroke-width="2" opacity="0.3"/>
      <path d="M1252 500 L1274 610" stroke-width="1.8" opacity="0.26"/>
      <path d="M1396 400 L1422 535" stroke-width="2.2" opacity="0.32"/>
      <path d="M1540 560 L1560 660" stroke-width="1.6" opacity="0.22"/>
      <path d="M1684 380 L1708 505" stroke-width="2" opacity="0.3"/>
      <path d="M1826 520 L1848 630" stroke-width="1.8" opacity="0.26"/>
      <path d="M1970 420 L1996 560" stroke-width="2.2" opacity="0.32"/>
      <path d="M2114 560 L2134 655" stroke-width="1.6" opacity="0.22"/>
      <path d="M2246 420 L2268 540" stroke-width="1.8" opacity="0.28"/>
      <path d="M2310 80 L2334 210" stroke-width="1.8" opacity="0.26"/>
      <path d="M2360 140 L2384 270" stroke-width="2" opacity="0.24"/>
      <path d="M2350 240 L2374 370" stroke-width="1.6" opacity="0.22"/>
      <path d="M2328 520 L2352 650" stroke-width="1.8" opacity="0.24"/>
      <path d="M2382 420 L2400 550" stroke-width="1.6" opacity="0.2"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="2400" height="1400" fill="url(#s1-sky)"/>
  <rect x="0" y="40" width="2400" height="300" fill="url(#s1-cloud)"/>

  <!-- 地平线雾气（两端透明） -->
  <rect x="0" y="980" width="2400" height="180" fill="url(#s1-mist)"/>

  <!-- 花苞背后的暖光：8s 呼吸，动画 1/3 -->
  <ellipse id="s1-halo" cx="1200" cy="880" rx="460" ry="360" fill="url(#s1-glow)" opacity="0.4">
    <animate attributeName="opacity" values="0.32;0.6;0.32" keyTimes="0;0.5;1" calcMode="spline"
      keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 地面带（标准锚线，精确） -->
  <rect x="0" y="1100" width="2400" height="300" fill="#F2E8D5"/>

  <!-- 湿地暗部 -->
  <ellipse cx="1200" cy="1152" rx="880" ry="62" fill="url(#s1-wet)"/>

  <!-- 水洼 -->
  <ellipse cx="1200" cy="1238" rx="330" ry="48" fill="#DFD1B4" opacity="0.55"/>
  <ellipse cx="1200" cy="1234" rx="292" ry="36" fill="#CBDDE9" opacity="0.4"/>
  <ellipse cx="1200" cy="1226" rx="200" ry="22" fill="#F2E8D5" opacity="0.3"/>
  <ellipse cx="1200" cy="1232" rx="86" ry="16" fill="#6FA8DC" opacity="0.2"/>
  <ellipse cx="1200" cy="1246" rx="220" ry="28" fill="none" stroke="#6FA8DC" stroke-width="2" opacity="0.3"/>
  <ellipse cx="1200" cy="1250" rx="300" ry="38" fill="none" stroke="#6FA8DC" stroke-width="2" opacity="0.16"/>

  <!-- 春草（春季 #A8C686；只放中央，左右 80px 留白给锚线） -->
  <g fill="none" stroke="#A8C686" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M1040 1176 C 1034 1146, 1028 1128, 1018 1114"/>
    <path d="M1048 1176 C 1046 1144, 1050 1124, 1056 1108"/>
    <path d="M1056 1176 C 1060 1150, 1068 1132, 1080 1120"/>
    <path d="M1360 1170 C 1366 1140, 1372 1124, 1382 1110"/>
    <path d="M1352 1170 C 1354 1140, 1350 1120, 1344 1104"/>
    <path d="M1344 1170 C 1340 1146, 1332 1128, 1320 1116"/>
    <path d="M1128 1184 C 1124 1166, 1120 1154, 1114 1144" stroke-width="3.4"/>
    <path d="M1134 1184 C 1136 1164, 1142 1152, 1150 1142" stroke-width="3.4"/>
    <path d="M1280 1186 C 1284 1166, 1290 1154, 1298 1144" stroke-width="3.4"/>
    <path d="M1272 1186 C 1270 1164, 1264 1152, 1256 1142" stroke-width="3.4"/>
  </g>

  <!-- 花苞主体：8s 轻晃，动画 2/3 -->
  <g id="s1-bud">
    <animateTransform attributeName="transform" type="rotate"
      values="-1.5 1200 1150; 1.5 1200 1150; -1.5 1200 1150"
      keyTimes="0;0.5;1" calcMode="spline"
      keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
      dur="8s" repeatCount="indefinite"/>

    <!-- 茎 -->
    <path d="M1200 1152 C 1196 1056, 1197 950, 1204 872" fill="none" stroke="#A8C686" stroke-width="10" stroke-linecap="round"/>
    <path d="M1200 1152 C 1196 1056, 1197 950, 1204 872" fill="none" stroke="#BCD49E" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- 叶 -->
    <path d="M1200 1032 C 1162 1022, 1126 998, 1100 966 C 1138 974, 1178 996, 1200 1032 Z" fill="url(#s1-leaf)"/>
    <path d="M1204 994 C 1248 986, 1288 958, 1308 924 C 1268 932, 1226 952, 1204 994 Z" fill="url(#s1-leaf)"/>
    <path d="M1200 1104 C 1174 1096, 1152 1080, 1140 1060 C 1166 1068, 1188 1080, 1200 1104 Z" fill="#A8C686" opacity="0.9"/>
    <path d="M1204 1082 C 1228 1074, 1250 1058, 1262 1040 C 1238 1046, 1216 1058, 1204 1082 Z" fill="#A8C686" opacity="0.85"/>

    <!-- 花萼 -->
    <path d="M1204 872 C 1188 872, 1170 882, 1158 902 C 1180 896, 1196 886, 1204 872 Z" fill="#A8C686"/>
    <path d="M1204 872 C 1220 872, 1238 882, 1250 902 C 1228 896, 1212 886, 1204 872 Z" fill="#A8C686"/>
    <path d="M1204 874 C 1198 892, 1198 910, 1206 928 C 1210 910, 1210 892, 1204 874 Z" fill="#93B672"/>

    <!-- 花苞（未开） -->
    <path d="M1204 872 C 1166 858, 1142 822, 1140 778 C 1138 734, 1164 682, 1200 640 C 1236 682, 1262 734, 1260 778 C 1258 822, 1242 858, 1204 872 Z" fill="url(#s1-budgrad)"/>
    <path d="M1204 866 C 1180 848, 1166 810, 1168 774 C 1170 732, 1184 684, 1200 656 C 1188 700, 1184 748, 1186 786 C 1188 824, 1196 850, 1204 866 Z" fill="#5B93C4" opacity="0.45"/>
    <path d="M1216 664 C 1236 700, 1246 742, 1244 780 C 1242 818, 1230 850, 1212 866 C 1224 830, 1230 788, 1228 750 C 1226 712, 1218 686, 1216 664 Z" fill="#9CC6E9" opacity="0.5"/>
    <path d="M1200 860 C 1194 806, 1196 726, 1200 662" fill="none" stroke="#4F84B2" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
    <path d="M1200 860 C 1206 806, 1206 726, 1200 662" fill="none" stroke="#4F84B2" stroke-width="2.5" opacity="0.22" stroke-linecap="round"/>

    <!-- 雨珠 -->
    <ellipse cx="1200" cy="640" rx="5" ry="8" fill="#DCEBF6" opacity="0.85"/>
    <ellipse cx="1148" cy="760" rx="3" ry="4.5" fill="#F2E8D5" opacity="0.8"/>
    <ellipse cx="1244" cy="716" rx="2.6" ry="4" fill="#F2E8D5" opacity="0.7"/>
  </g>

  <!-- 春雨：整体下移 600 后与自身重合，8s 无缝循环，动画 3/3；外层 mask 让雨在左右 120px 内渐变到透明 -->
  <g id="s1-rainwrap" mask="url(#s1-rainmask)">
    <g id="s1-rain" opacity="0.9">
      <use href="#s1-rainfield" y="-600"/>
      <use href="#s1-rainfield"/>
      <use href="#s1-rainfield" y="600"/>
      <use href="#s1-rainfield" y="1200"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 600" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 贯穿全卷的蓝线（标准锚线，原样使用；放在最上层，保证拼接后不断线） -->
  <path d="M0 900 C 600 860, 1800 940, 2400 900" fill="none" stroke="#6FA8DC" stroke-width="6" stroke-linecap="round"/>
</svg>
