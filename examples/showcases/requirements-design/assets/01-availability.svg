<title id="title">UI01 选日期与时段</title><desc id="desc">从空闲时段进入核对；不可用原因直接展示。。静态原创界面草图，非可运行应用。中文文本和矢量元素可编辑。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .focus{stroke:#126C68;stroke-width:3}</style>
<rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F4F6F5" stroke="#F4F6F5"/>
<text x="58" y="55" font-size="18" fill="#126C68" font-weight="700">声隅  /  PRODUCT NOTES</text><text x="58" y="108" font-size="36" fill="#202D39" font-weight="700">UI01  选日期与时段</text><text x="58" y="148" font-size="18" fill="#60717E" font-weight="400">从空闲时段进入核对；不可用原因直接展示。</text>
<rect x="58" y="185" width="690" height="716" rx="12" fill="white" stroke="#D7DFE2"/><text x="90" y="225" font-size="24" fill="#202D39" font-weight="700">预约录音舱</text><text x="90" y="258" font-size="16" fill="#60717E" font-weight="400">社区空间 01  ·  Asia/Hong_Kong</text><text x="90" y="302" font-size="17" fill="#60717E" font-weight="400">日期</text><rect x="90" y="317" width="625" height="53" rx="12" fill="#F5F8F7" stroke="#D7DFE2"/><text x="108" y="351" font-size="20" fill="#202D39" font-weight="400">2026-10-21  周三       ‹ 前一天   后一天 ›</text><text x="90" y="401" font-size="17" fill="#60717E" font-weight="400">每次 30 分钟 · 每人最多一条未结束预约</text><rect x="90" y="425" width="625" height="61" rx="8" fill="#FAFBFB" stroke="#D7DFE2"/><text x="109" y="464" font-size="21" fill="#202D39" font-weight="600">18:00–18:30</text><text x="428" y="463" font-size="17" fill="#60717E" font-weight="400">已预约 · 不可选</text><rect x="90" y="499" width="625" height="61" rx="8" fill="#E7F3EF" stroke="#126C68"/><text x="109" y="538" font-size="21" fill="#202D39" font-weight="600">18:30–19:00</text><text x="428" y="537" font-size="17" fill="#126C68" font-weight="400">空闲 · 已选中</text><rect x="90" y="573" width="625" height="61" rx="8" fill="#FAFBFB" stroke="#D7DFE2"/><text x="109" y="612" font-size="21" fill="#202D39" font-weight="600">19:00–19:30</text><text x="428" y="611" font-size="17" fill="#60717E" font-weight="400">维护 · 不可选</text><rect x="90" y="647" width="625" height="61" rx="8" fill="#FAFBFB" stroke="#D7DFE2"/><text x="109" y="686" font-size="21" fill="#202D39" font-weight="600">19:30–20:00</text><text x="428" y="685" font-size="17" fill="#60717E" font-weight="400">空闲 · 可选择</text><text x="90" y="754" font-size="19" fill="#126C68" font-weight="600">已选 10 月 21 日 18:30–19:00</text><rect x="90" y="780" width="625" height="48" rx="8" fill="#126C68" stroke="#126C68"/><text x="108" y="811" font-size="17" fill="white" font-weight="600">继续核对  →  UI02</text><text x="90" y="864" font-size="18" fill="#126C68" font-weight="400">查看我的预约  →  UI03</text><text x="798" y="225" font-size="24" fill="#202D39" font-weight="700">交互与追踪</text><text x="798" y="273" font-size="18" fill="#202D39" font-weight="400">01  选择日期与空闲时段</text><text x="798" y="303" font-size="18" fill="#202D39" font-weight="400">选择后更新摘要；换日期清除选择。</text><text x="798" y="333" font-size="18" fill="#202D39" font-weight="400">过去、已开始、维护和已预约档禁用。</text><text x="798" y="363" font-size="18" fill="#202D39" font-weight="400">键盘焦点可见，Enter 选择并继续。</text><text x="798" y="430" font-size="18" fill="#202D39" font-weight="400">02  有配额占用时</text><text x="798" y="460" font-size="18" fill="#202D39" font-weight="400">提示“已有一条未结束预约”。</text><text x="798" y="490" font-size="18" fill="#202D39" font-weight="400">继续按钮不可用，提供查看预约入口。</text><rect x="786" y="552" width="594" height="137" rx="12" fill="#E7F3EF" stroke="#E7F3EF"/><text x="808" y="588" font-size="18" fill="#202D39" font-weight="400">D01 同时响应 R01 / R03 / R06</text><text x="808" y="618" font-size="18" fill="#202D39" font-weight="400">状态有文字说明，不只靠颜色。</text><text x="808" y="648" font-size="18" fill="#202D39" font-weight="400">列表是快照，提交前仍需重新校验。</text><text x="798" y="746" font-size="18" fill="#202D39" font-weight="400">验收定位：A01 / A04 / A07 / A09</text><text x="798" y="776" font-size="18" fill="#202D39" font-weight="400">时长变更 C01：要找连续两个空闲档，</text><text x="798" y="806" font-size="18" fill="#202D39" font-weight="400">并把最后可选开始时刻改成 20:00。</text>
<text x="58" y="952" font-size="17" fill="#60717E" font-weight="400">原创需求设计案例 · 虚构数据 · 所有产品验收未执行</text><text x="1090" y="952" font-size="17" fill="#60717E" font-weight="400">基线 v1  /  30 分钟</text>
