<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">UI02 核对并提交预约</title><desc id="desc">提交由服务端裁决；重复点击和未知结果有明确反馈。。静态原创界面草图，非可运行应用。中文文本和矢量元素可编辑。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .focus{stroke:#126C68;stroke-width:3}</style>
<rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F4F6F5" stroke="#F4F6F5"/>
<text x="58" y="55" font-size="18" fill="#126C68" font-weight="700">声隅  /  PRODUCT NOTES</text><text x="58" y="108" font-size="36" fill="#202D39" font-weight="700">UI02  核对并提交预约</text><text x="58" y="148" font-size="18" fill="#60717E" font-weight="400">提交由服务端裁决；重复点击和未知结果有明确反馈。</text>
<rect x="58" y="185" width="690" height="716" rx="12" fill="white" stroke="#D7DFE2"/><text x="90" y="225" font-size="18" fill="#126C68" font-weight="400">‹ 返回选时段</text><text x="90" y="278" font-size="28" fill="#202D39" font-weight="700">确认这次预约</text><rect x="90" y="309" width="625" height="178" rx="12" fill="#F5F8F7" stroke="#D7DFE2"/><text x="113" y="348" font-size="20" fill="#202D39" font-weight="400">社区录音舱 01</text><text x="113" y="382" font-size="20" fill="#202D39" font-weight="400">2026-10-21  周三</text><text x="113" y="416" font-size="20" fill="#202D39" font-weight="400">18:30–19:00   /   30 分钟</text><text x="113" y="450" font-size="20" fill="#202D39" font-weight="400">场地时区 Asia/Hong_Kong</text><text x="90" y="530" font-size="18" fill="#202D39" font-weight="400">每人最多保留一条未结束预约。</text><text x="90" y="563" font-size="18" fill="#202D39" font-weight="400">开始前可取消，取消后名额会重新开放。</text><text x="90" y="596" font-size="18" fill="#202D39" font-weight="400">提交时重新检查占用、维护和个人配额。</text><rect x="90" y="648" width="625" height="48" rx="8" fill="#126C68" stroke="#126C68"/><text x="108" y="679" font-size="17" fill="white" font-weight="600">确认预约</text><text x="90" y="733" font-size="17" fill="#60717E" font-weight="400">提交中：按钮禁用，显示“正在确认…”</text><rect x="90" y="768" width="625" height="90" rx="12" fill="#FFF5E4" stroke="#E5CCA1"/><text x="108" y="802" font-size="17" fill="#8D5B0A" font-weight="400">结果未知：正在确认是否预约成功。</text><text x="108" y="830" font-size="17" fill="#8D5B0A" font-weight="400">保留本次请求，重试确认结果。</text><text x="798" y="225" font-size="24" fill="#202D39" font-weight="700">提交分支</text><text x="798" y="275" font-size="18" fill="#202D39" font-weight="400">成功 → UI03</text><text x="798" y="305" font-size="18" fill="#202D39" font-weight="400">显示同一条已预约记录；刷新可回读。</text><text x="798" y="373" font-size="18" fill="#202D39" font-weight="400">被抢先 / 新增维护 / 已开始 → UI01</text><text x="798" y="403" font-size="18" fill="#202D39" font-weight="400">提示具体原因，返回仍保留所选日期。</text><text x="798" y="433" font-size="18" fill="#202D39" font-weight="400">已有个人预约 → UI03 查看预约。</text><text x="798" y="500" font-size="18" fill="#202D39" font-weight="400">网络未知 → 留在当前页重试</text><text x="798" y="530" font-size="18" fill="#202D39" font-weight="400">沿用同一提交标识，先找已成功结果。</text><text x="798" y="560" font-size="18" fill="#202D39" font-weight="400">不能凭按钮禁用代替服务端防重。</text><rect x="786" y="636" width="594" height="111" rx="12" fill="#E7F3EF" stroke="#E7F3EF"/><text x="808" y="673" font-size="18" fill="#202D39" font-weight="400">D02 响应 R02 / R03 / R06</text><text x="808" y="703" font-size="18" fill="#202D39" font-weight="400">A02 / A03 / A04 / A07 / A08 / A09</text><text x="798" y="800" font-size="18" fill="#202D39" font-weight="400">C01 方案 A：连续两档整体成功或失败，</text><text x="798" y="830" font-size="18" fill="#202D39" font-weight="400">核对时长改成 60 分钟，重试仍是一单。</text>
<text x="58" y="952" font-size="17" fill="#60717E" font-weight="400">原创需求设计案例 · 虚构数据 · 所有产品验收未执行</text><text x="1090" y="952" font-size="17" fill="#60717E" font-weight="400">基线 v1  /  30 分钟</text>
</svg>