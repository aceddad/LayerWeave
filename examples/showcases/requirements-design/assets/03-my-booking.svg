<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">UI03 我的预约与取消</title><desc id="desc">显示本人记录、确认释放后果，并把未决策略留在评审中。。静态原创界面草图，非可运行应用。中文文本和矢量元素可编辑。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .focus{stroke:#126C68;stroke-width:3}</style>
<rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F4F6F5" stroke="#F4F6F5"/>
<text x="58" y="55" font-size="18" fill="#126C68" font-weight="700">声隅  /  PRODUCT NOTES</text><text x="58" y="108" font-size="36" fill="#202D39" font-weight="700">UI03  我的预约与取消</text><text x="58" y="148" font-size="18" fill="#60717E" font-weight="400">显示本人记录、确认释放后果，并把未决策略留在评审中。</text>
<rect x="58" y="185" width="690" height="716" rx="12" fill="white" stroke="#D7DFE2"/><text x="90" y="225" font-size="26" fill="#202D39" font-weight="700">我的预约</text><text x="90" y="260" font-size="17" fill="#60717E" font-weight="400">本人记录  ·  Asia/Hong_Kong</text><rect x="90" y="286" width="625" height="176" rx="12" fill="#F5F8F7" stroke="#D7DFE2"/><text x="110" y="321" font-size="18" fill="#126C68" font-weight="700">已预约</text><text x="110" y="361" font-size="24" fill="#202D39" font-weight="600">10 月 21 日  18:30–19:00</text><text x="110" y="396" font-size="18" fill="#60717E" font-weight="400">社区录音舱 01  ·  30 分钟</text><text x="110" y="434" font-size="18" fill="#126C68" font-weight="400">取消预约  ↓</text><text x="90" y="500" font-size="17" fill="#60717E" font-weight="400">点击取消后的确认弹窗（独立状态）</text><rect x="90" y="519" width="625" height="211" rx="12" fill="white" stroke="#202D39"/><text x="113" y="556" font-size="20" fill="#202D39" font-weight="400">取消 10 月 21 日 18:30–19:00？</text><text x="113" y="592" font-size="20" fill="#202D39" font-weight="400">释放后，这个时段可能被他人预约。</text><rect x="113" y="642" width="266" height="48" rx="8" fill="white" stroke="#126C68"/><text x="131" y="673" font-size="17" fill="#126C68" font-weight="600">保留预约</text><rect x="402" y="642" width="289" height="48" rx="8" fill="#126C68" stroke="#126C68"/><text x="420" y="673" font-size="17" fill="white" font-weight="600">确认取消</text><rect x="90" y="766" width="625" height="88" rx="12" fill="#E7F3EF" stroke="#E7F3EF"/><text x="110" y="800" font-size="17" fill="#126C68" font-weight="400">取消成功 → 已取消 · 18:30–19:00</text><text x="110" y="828" font-size="17" fill="#126C68" font-weight="400">刷新确认结果；重新预约需重新选择空闲档。</text><text x="798" y="225" font-size="24" fill="#202D39" font-weight="700">状态与缺口</text><text x="798" y="274" font-size="18" fill="#202D39" font-weight="400">now &lt; start：已预约，可取消。</text><text x="798" y="308" font-size="18" fill="#202D39" font-weight="400">start ≤ now &lt; end：使用时段中，不可取消。</text><text x="798" y="342" font-size="18" fill="#202D39" font-weight="400">end ≤ now：已结束；配额释放。</text><text x="798" y="376" font-size="18" fill="#202D39" font-weight="400">已取消：保留记录，不恢复原占用。</text><rect x="786" y="444" width="594" height="181" rx="12" fill="#FFF5E4" stroke="#E5CCA1"/><text x="808" y="482" font-size="18" fill="#8D5B0A" font-weight="400">Q01  待决定 / 教学缺口</text><text x="808" y="515" font-size="18" fill="#8D5B0A" font-weight="400">使用时段中 ≠ 已签到。</text><text x="808" y="548" font-size="18" fill="#8D5B0A" font-weight="400">尚未决定迟到如何释放，也无签到信号。</text><text x="808" y="581" font-size="18" fill="#8D5B0A" font-weight="400">R07 → D04 / A10：阻塞，不能标通过。</text><text x="798" y="684" font-size="18" fill="#202D39" font-weight="400">D03 响应 R04 / R05</text><text x="798" y="714" font-size="18" fill="#202D39" font-weight="400">验收定位：A02 / A05 / A06 / A09</text><text x="798" y="744" font-size="18" fill="#202D39" font-weight="400">取消响应未知时，刷新服务端状态确认。</text><text x="798" y="814" font-size="18" fill="#202D39" font-weight="400">C01 方案 A：取消一次释放两档；</text><text x="798" y="844" font-size="18" fill="#202D39" font-weight="400">新旧时长都按记录中的实际区间显示。</text>
<text x="58" y="952" font-size="17" fill="#60717E" font-weight="400">原创需求设计案例 · 虚构数据 · 所有产品验收未执行</text><text x="1090" y="952" font-size="17" fill="#60717E" font-weight="400">基线 v1  /  30 分钟</text>
</svg>