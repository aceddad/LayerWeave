[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layerweave"
dynamic = ["version"]
description = "Layers, objects and composable tools for AI workflows"
readme = "README.md"
license = "MIT AND ISC AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/aceddad/LayerWeave"
Gitee = "https://gitee.com/emotion1354414/layer-weave"

[tool.setuptools.dynamic]
version = {attr = "layerweave.__version__"}

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3", "jsonschema>=4.23,<5"]
dev = ["build>=1.2", "setuptools>=77.0.3", "wheel"]

[project.scripts]
layerweave = "layerweave.tool.builtin.shared.launcher.__main__:main"
layerweave-mcp = "layerweave.tool.builtin.shared.mcp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["layerweave", "layerweave.*"]
exclude = ["layerweave.configs*", "layerweave.tool.skills*"]
namespaces = false

[tool.setuptools.package-data]
"layerweave" = ["component.toml", "tool/builtin/**/component.toml", "configs/**/*.toml", "**/*.md", "tool/skills/**/*"]
"layerweave.support.storage" = ["schema.sql"]
"layerweave.support.numbering" = ["README.md"]
"layerweave.tool.builtin.developer.keys" = ["example.json", "README.md"]
"layerweave.tool.builtin.developer.versions" = ["README.md"]
"layerweave.tool.builtin.shared.mcp" = ["README.md", "example.json"]
"layerweave.tool.builtin.shared.help" = ["README.md", "COMMANDS.md", "CONFIG_HELP.md"]
"layerweave.tool.builtin.shared.launcher" = ["data/*.json", "data/*.zip"]
"layerweave.tool.builtin.usage.exchange" = ["templates/*.json", "README.md", "FORMAT.md", "DEVELOPMENT.md"]
"layerweave.tool.builtin.view" = ["web/*", "web/assets/*", "locales/*.json", "layout-defaults.json", "LANGUAGES.md", "GUIDE.md", "DEVELOPMENT.md", "sdk/**/*.d.ts", "sdk/**/snapshot.json", "README.md", "PLUGINS.md", "PERFORMANCE.md", "INCREMENTAL.md"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.py[cod]", "**/.env", "**/.env.*", "**/keys.local.json", "**/keys.json", "**/.keys.local.json.*.tmp", "**/*.sqlite3", "**/*.sqlite3-*", "**/*.db", "**/*.log", "**/.DS_Store"]
