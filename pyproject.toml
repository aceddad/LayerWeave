[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layerweave"
version = "0.1.0"
description = "Layers, objects and composable tools for AI workflows"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["layerweave", "layerweave.*"]
exclude = ["layerweave.configs*", "layerweave.tool.skills*"]
namespaces = false

[tool.setuptools.package-data]
"layerweave" = ["configs/**/*.toml", "configs/**/*.md", "tool/skills/**/*"]
"layerweave.support.storage" = ["schema.sql"]
"layerweave.tool.builtin.developer.keys" = ["example.json"]
