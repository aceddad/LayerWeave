[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layerweave"
dynamic = ["version"]
description = "LayerWeave development sources and composable non-visual tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://gitee.com/emotion1354414/layer-weave/tree/main"

[project.optional-dependencies]
dev = ["build>=1.2", "setuptools>=77.0.3", "wheel"]

[tool.setuptools.dynamic]
version = {attr = "layerweave.__version__"}

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["layerweave", "layerweave.*"]
exclude = ["layerweave.configs*", "layerweave.tool.skills*"]
namespaces = false

[tool.setuptools.package-data]
"layerweave" = ["component.toml", "tool/builtin/**/component.toml", "configs/**/*.toml", "**/*.md", "tool/skills/**/*"]
"layerweave.support.storage" = ["schema.sql"]
"layerweave.tool.builtin.developer.keys" = ["example.json"]
"layerweave.tool.builtin.usage.exchange" = ["templates/*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.py[cod]", "**/.env", "**/.env.*", "**/keys.local.json", "**/keys.json", "**/.keys.local.json.*.tmp", "**/*.sqlite3", "**/*.sqlite3-*", "**/*.db", "**/*.log", "**/.DS_Store"]
