# 音频层封装
# extends 相对于当前配置文件；配置由 runtime.configuration 读取，约定在提交后检测。
# 基础字段、return_self() 和基础检测规则沿用父配置，不重复声明。

[layer]
type    = "audio"
version = 1
name    = "音频层"
class   = "layerweave.models.layers.audio:AudioLayer"
extends = "base.toml"
objects = "audio"
when    = "组织音频资源，例如音乐、人声、音效"
tools = []  # 外置技能引用；每项写 route（位置）、tier（分类）、when（使用时机），供 AI 阅读

[layer.constraint]
overlap = true                # 允许对象在轴上的区间重叠，不控制显隐

[layer.display]
visibility = true             # 默认允许显隐控制

# 空层创建参数示例；向 objects 放入对应的对象实例。
[layer.example]
name    = "背景音乐"
axis    = { unit = "秒", precision = 0.001 }
objects = []
