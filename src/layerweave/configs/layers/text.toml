# 文字层封装
# extends 相对于当前配置文件；读取器展开父配置并保留固定约定。
# 基础字段、return_self() 和基础检测规则沿用父配置，不重复声明。

[layer]
type    = "text"                         # 层的类型标识，由保存接口读取
version = 1                              # 这份配置的版本
name    = "文字层"                       # 封装显示名；实例名字创建时另传
class   = "layerweave.models.layers.text:TextLayer"  # 对应的 Python 类
extends = "base.toml"                     # 对应 Layer 的基础配置
objects = "text"                         # 对应文字对象配置；按对象配置 type 唯一定位
when    = "组织文本内容，例如主线说明、歌词、笔记"
tools = [  # 外置技能引用；每项写 route（位置）、tier（分类）、when（使用时机），供 AI 阅读
  { route = "src/layerweave/tool/skills/layers/text/glyph-deform/SKILL.md", tier = "层级", when = "文字要作为有重量的物体受力、切开、碎裂，做动态字体时" },
  { route = "src/layerweave/tool/skills/layers/text/text-redacted-layout/SKILL.md", tier = "层级", when = "不方便显示原文（歌词等）却要检查排版、闪烁和源码里有没有写死原文时；闪烁扫描属于可用级" },
]

[layer.constraint]
overlap = true                            # 允许文字对象在轴上的区间重叠

[layer.display]
visibility = true                         # 允许视图提供显隐控制

# 空文字层的创建参数示例；随后向 objects 放入 Text 实例。
[layer.example]
name    = "主线说明"
axis    = { unit = "秒", precision = 0.001 }
tips    = "记录作品各段的意图"
objects = []
