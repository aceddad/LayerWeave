# 动作对象封装
# extends 相对于当前配置文件；配置由 runtime.configuration 读取，约定在提交后检测。
# 基础字段、return_self() 和基础检测规则沿用父配置，不重复声明。

[object]
type    = "active"
version = 1
name    = "动作对象"
class   = "layerweave.models.objects.active:Active"
extends = "base.toml"
note    = "通过 information.source 引用动作，或用 information.data 承载动作数据；作用对象通过 bind 说明"
open    = true                 # 保留附加内容

# optional=true 允许缺省并随字段继承，检查仍执行；填入后继续检查类型。
# 产生的诊断由 ../logging/diagnostics.toml 指定等级；不拦截，不检查格式或资源存在性。
# 引用只作为字符串保存，由使用方解释；本类不读取或解析资源。
[object.information]
source = { type = "str", optional = true, note = "动作资源引用，例如本地路径、URL 或使用方约定的资源地址" }
data = { type = "dict", optional = true, note = "可选的动作数据，具体结构由使用方约定；source 和 data 按需填写" }

[object.constraint]
duration = "any"               # 可以有时长，也可以表示瞬间

[object.display]
visibility = true              # 默认允许显隐控制

# 创建参数示例，假设已有编号为 1 的层；资源地址仅作示意。
# 创建后由调用方将对象实例放入该层的 objects。
[object.example]
name        = "角色行走"
layer       = 1
begin       = 0.0
end         = 5.0
information = { source = "assets/walk.json" }
