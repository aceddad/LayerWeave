name = "layerweave.view"
kind = "tool"
version = "0.13.2"
description = "视图：画布上的时间轴画板、批注层、截图与“正在看哪儿”，网页源码在仓库 frontend/view"
changes = "0.13.2：放大以后平移时，名字列、刻度角、标题跟着挪改成直接改它们自己的 transform；原来在画板根上设会继承的 CSS 变量，每一帧都要重算整块画板两千多个元素的样式；0.13.1：拖画板更顺（真实项目看全图时拖画板：帧间隔第 95 百分位 21–35→14 毫秒）——画板布局按行和像素比缓存，拖动时位置变了不再重算，几百个格子不跟着重画；拼接判断按排版数据算，不再每移一下都问页面（elementsFromPoint 逼整页重排）；0.13.0：点下去更快有反应（真实项目点选对象：画出来的中位数约 310→115 毫秒；已读、已处理、折叠 370–450→10–50 毫秒）——选中、高亮、连接点由每个格子自己订阅，点一下不再重画所有轨道；侧栏卡片用 640 宽缩略图、点开看原图；波形按 ResizeObserver 的尺寸只画一次，播放头是盖在上面的线；侧栏里看不见的卡片和楼跳过排版；写批注框单独订阅选择；已读、已处理、折叠先改画面再写数据库，写失败重读项目改回；截图用的无界面浏览器关掉扩展、同步、后台联网；0.12.0：性能（真实项目 800 个对象：打开 3.1→1.0 秒、下载 390→1 MB、平移 8.6→100+ 帧/秒、刷新 1.6→0.35 秒）——整理项目数据时不再逐个解析真实路径、同一文件只查一次、并行查；图片缩略图（/thumb，ffmpeg 缩小并缓存在本机视图目录）；音频波形在服务端算（/wave）；缩得很小时格子只画色块（镜头停下来才换档）；关系线的连接点只挂在要画线的对象上；拖画板时轨道段不跟着重画；0.11.0：批注的已读（每人各记各的，表 view_note；之后有人再写一条又算没读；view_note read/unread）；已处理的楼默认不列，只在“已处理”里（网页去掉“全部”，view_note 默认 --status open）；0.10.2：同一条批注在请求没回来前再点一次会被忽略（用户实际用时发重了一楼）；0.10.1：波形按分贝画 RMS（响度大的流行曲也看得出起伏）；瞬间标记之间不画空当标尺（第一次用在真项目上发现的）；0.10.0：人和 AI 各有各的折叠、互相看得见、都能展开对方的，折叠可写原因或备注（表 view_layer）；0.9.0：折叠存进视图自己的工具表 view_fold（身份用层的编号），网页和 AI 共用，新增 view_fold 命令；0.8.0：前端单元测试、截图对准批注和链接、键盘跳转、批注提醒、空当标尺"
