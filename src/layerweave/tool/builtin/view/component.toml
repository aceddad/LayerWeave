name = "layerweave.view"
kind = "tool"
version = "0.12.0"
description = "视图：画布上的时间轴画板、批注层、截图与“正在看哪儿”，网页源码在仓库 frontend/view"
changes = "0.12.0：性能（真实项目 800 个对象：打开 3.1→1.0 秒、下载 390→1 MB、平移 8.6→100+ 帧/秒、刷新 1.6→0.35 秒）——整理项目数据时不再逐个解析真实路径、同一文件只查一次、并行查；图片缩略图（/thumb，ffmpeg 缩小并缓存在本机视图目录）；音频波形在服务端算（/wave）；缩得很小时格子只画色块（镜头停下来才换档）；关系线的连接点只挂在要画线的对象上；拖画板时轨道段不跟着重画；0.11.0：批注的已读（每人各记各的，表 view_note；之后有人再写一条又算没读；view_note read/unread）；已处理的楼默认不列，只在“已处理”里（网页去掉“全部”，view_note 默认 --status open）；0.10.2：同一条批注在请求没回来前再点一次会被忽略（用户实际用时发重了一楼）；0.10.1：波形按分贝画 RMS（响度大的流行曲也看得出起伏）；瞬间标记之间不画空当标尺（第一次用在真项目上发现的）；0.10.0：人和 AI 各有各的折叠、互相看得见、都能展开对方的，折叠可写原因或备注（表 view_layer）；0.9.0：折叠存进视图自己的工具表 view_fold（身份用层的编号），网页和 AI 共用，新增 view_fold 命令；0.8.0：前端单元测试、截图对准批注和链接、键盘跳转、批注提醒、空当标尺"
