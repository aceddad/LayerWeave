name = "layerweave.view"
kind = "tool"
version = "0.27.0"
description = "视图：画布上的时间轴画板、批注层、截图与“正在看哪儿”，网页源码在仓库 frontend/view"
changes = "0.27.0：选用：自带插件各有默认开关——一览默认开，接缝、预览默认关（在「插件」小窗或 view_plugin on 打开），免得装到不想要的；本机清单只在和默认不一样时记一行；view_plugin 列出时写明默认开还是关；0.26.0：预览插件（自带）：把视频、会动的 SVG（SMIL / CSS 动画，去掉脚本）、GIF / 动态 WebP / APNG 的帧罗列出来，默认逐帧，可以改开始的秒、间隔（逐帧、每几帧、每几秒）和帧率（视频播几帧量出来）；一页一屏（默认 48）；候选视频在前，目录勾了层时只列那几层；截图 --view preview --param object=… --param step=1f 拍一页；0.25.0：一览搬成视图自带的插件（地址 view=assets 不变，可以在「插件」里关掉，顶栏仍排最后）并分页：一页 60 张（可换 30、120），按种类筛选回到第 1 页；插件可用的分页部件 Pager 和 util.pageSlice，另加 Waveform、mediaUrl（只加不改）；截图 --param 名字=值 给插件页面传地址参数（比如 --view assets --param page=3）；0.24.0：画布左边的目录——项目的层按 根 → 层 → 子层 列出来（画面外的、折叠的也在），每行写对象数、谁折叠的、几楼批注没处理；点层名镜头过去；▾/▸ 只在目录里收起，不动画布上的折叠；勾选连同子层，「只看勾选的」就是层过滤（同截图 --layers、链接 layers=），「折叠勾选的」一次折叠；点对象数列出这一层的对象；目录开关记在本机；截图 --tree 打开目录；插件的 useView() 多了 picked（勾选的层）；0.23.0：封装前收拾插件接口——收回插件画格子（block 栏位：一类对象只能有一种画法，也还没有真正用它的插件；代码另存为未完成），插件接口版本 host.api 升到 3；样板插件「字数」只剩侧栏和对象详情；view_bench 随之去掉「放大后平移，插件画格子」一项（剩四项，门槛不变）；「沿着读」改名「沿读」（只改给人看的字，side=walk 和 view_walk 不变）；0.22.1：修复长视频首尾帧随对象长度降采样；图片减少中间位图缩放、按显示需求选择高清源，保持共享画布密度与交互；0.22.0：性能量具校正输入节拍与空场景判定；拖动瞬时位置局部化、关系拓扑缓存；媒体分批准备并按轨道分块共享画布，保留对象交互与异步插件；快照游标和增量刷新保持派生缓存，修正轮询、项目切换和乐观更新竞态；0.21.0：视图的两张表接上 astra 加的逻辑引用——折叠表 view_layer 声明逻辑引用到层（不是外键，不挡删层），JSON 交换复制项目时折叠跟着层换号；已读表 view_note 逻辑引用到批注，复制时不带（exchange.on_copy = skip，新项目里重新记）；新命令 view_tables 查库里登记的是不是现在的声明，--upgrade 显式升级旧库（只改声明，不改数据）；视图服务启动时发现旧声明会提示；0.20.1：视图包补上 __init__.py——以前打包时整个视图包（模块、网页、内置插件）都没进安装包，源码里照常能用所以一直没发现；打包检查（tests/check_wheel.py）现在通过，装好以后 44 个命令都在、网页和接缝插件能打开；0.20.0：性能门槛 view_bench——造 800 个对象的合成项目（或给一个库），用无界面浏览器量打开、点选、拖画板、放大后平移、有插件画格子时的平移，3 轮取中位和门槛比（打开 ≤ 2 秒、点选中位 ≤ 120 毫秒、帧间隔 p95 ≤ 33 毫秒），超过的标红、退出码 1，--baseline 和改之前的构建交替量；拖的时候把画板单独放一层（will-change，手书拖画板帧间隔 p95 42→14 毫秒）；看全图时格子里就有几百张缩略图的项目拖画板仍然慢，没解决（合成项目超过门槛）；视图服务可以换一份网页（make_server 的 web_root）；0.19.0：插件的栏位——除了顶栏页面和 [ ] 跳转点，插件还能给侧栏一个标签（side）、选中对象的详情一段（objectDetail）、某类对象在画布格子里画什么（block：按对象类型名或种类认，和缩略图同一个重画队列，截图等它画完）；每个栏位包着出错保护，插件出错只在自己那块写一句；截图 --side 打开别的侧栏（插件的侧栏写插件的名字）；插件名不能用视图自己侧栏的名字；接口版本 host.api = 2；仓库里的样板插件 frontend/view/example-plugin（「字数」，不用构建）；0.18.0：插件改由视图管一份本机清单（~/.layerweave/view/plugins.json）——清单里有的、开着的才载入，不再扫描 component.toml；内置的接缝写在 plugins.py，只能关；别的插件用 view_plugin add 链接一个 js（或网页顶栏「插件」小窗里加），去掉只删登记不删文件；清单和默认文件夹在本机用户目录，软件更新冲不掉，安装目录里的文件加不进来；改了不用重启，页面轮询时跟上，关掉的插件连样式一起拿下来；插件文件夹里的网页文件也能访问；0.17.0：视图插件接口——工具包在 component.toml 里写 [[view_plugins]]，视图服务找出来（/api/plugins），页面 import() 加载，不用重新编译视图；插件拿到宿主给的 React、读项目的钩子、动作、小部件和工具函数，可以给页面和键盘 [ ] 的跳转点；接缝搬成第一个插件（源码 frontend/view/plugins/cuts）；截图 --view 认插件的页面；0.16.0：修补第一批——「素材」页改名「一览」（只改给人看的字，地址和 --view assets 不变）；圈一段时间的批注带子不再挡住下面的对象（只有两边的竖线和标签能点，点了打开那一楼）；批注改指向（view_note edit --to、网页楼主上的「改指向」，楼号、回复、已读不变，回复不能改）；按时刻读 view_at（某一刻或一段上每层是什么、怎么连着、哪些批注指着它们，不给参数读用户正在看的地方；此刻面板「复制文字版」）；截图 --layers 认层名和 上级/名字 路径；0.15.0：沿着读（修理清单第 2 条）——view_walk 从一个对象或层出发顺着关联一步步往外读，按步数列出每一步是什么、怎么连过来的，到上限写明还有几条没走；网页侧栏新标签「沿着读」用同一份结果（/api/walk），对象详情和楼主卡片上有入口，点一步镜头过去，可从任一步接着读；复制链接、截图认 walk 参数；0.14.0：画布格子里的缩略图、视频画面画进 canvas，只画一次，按镜头停下时的缩放定清晰度（放大到 1.6 倍、104 张图时平移：帧间隔 p95 35–42→7 毫秒，慢帧 24–48→0）；换缩放时的重画排队，每帧最多画 8 毫秒；离画面近了才下载；截图等画完再举手；0.13.2：放大以后平移时，名字列、刻度角、标题跟着挪改成直接改它们自己的 transform；原来在画板根上设会继承的 CSS 变量，每一帧都要重算整块画板两千多个元素的样式；0.13.1：拖画板更顺（真实项目看全图时拖画板：帧间隔第 95 百分位 21–35→14 毫秒）——画板布局按行和像素比缓存，拖动时位置变了不再重算，几百个格子不跟着重画；拼接判断按排版数据算，不再每移一下都问页面（elementsFromPoint 逼整页重排）；0.13.0：点下去更快有反应（真实项目点选对象：画出来的中位数约 310→115 毫秒；已读、已处理、折叠 370–450→10–50 毫秒）——选中、高亮、连接点由每个格子自己订阅，点一下不再重画所有轨道；侧栏卡片用 640 宽缩略图、点开看原图；波形按 ResizeObserver 的尺寸只画一次，播放头是盖在上面的线；侧栏里看不见的卡片和楼跳过排版；写批注框单独订阅选择；已读、已处理、折叠先改画面再写数据库，写失败重读项目改回；截图用的无界面浏览器关掉扩展、同步、后台联网；0.12.0：性能（真实项目 800 个对象：打开 3.1→1.0 秒、下载 390→1 MB、平移 8.6→100+ 帧/秒、刷新 1.6→0.35 秒）——整理项目数据时不再逐个解析真实路径、同一文件只查一次、并行查；图片缩略图（/thumb，ffmpeg 缩小并缓存在本机视图目录）；音频波形在服务端算（/wave）；缩得很小时格子只画色块（镜头停下来才换档）；关系线的连接点只挂在要画线的对象上；拖画板时轨道段不跟着重画；0.11.0：批注的已读（每人各记各的，表 view_note；之后有人再写一条又算没读；view_note read/unread）；已处理的楼默认不列，只在“已处理”里（网页去掉“全部”，view_note 默认 --status open）；0.10.2：同一条批注在请求没回来前再点一次会被忽略（用户实际用时发重了一楼）；0.10.1：波形按分贝画 RMS（响度大的流行曲也看得出起伏）；瞬间标记之间不画空当标尺（第一次用在真项目上发现的）；0.10.0：人和 AI 各有各的折叠、互相看得见、都能展开对方的，折叠可写原因或备注（表 view_layer）；0.9.0：折叠存进视图自己的工具表 view_fold（身份用层的编号），网页和 AI 共用，新增 view_fold 命令；0.8.0：前端单元测试、截图对准批注和链接、键盘跳转、批注提醒、空当标尺"