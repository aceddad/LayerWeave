<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LayerWeave 视图</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <strong class="brand">LayerWeave</strong>
  <select id="project" title="项目"></select>
  <nav id="tabs">
    <button data-view="timeline" class="on">时间轴</button>
    <button data-view="assets">素材</button>
  </nav>
  <div class="spacer"></div>
  <span id="clock" title="播放头位置">—</span>
  <div id="zoom" class="timeline-only">
    <button data-zoom="out" title="缩小">−</button>
    <button data-zoom="fit" title="全部显示">适应</button>
    <button data-zoom="in" title="放大">＋</button>
  </div>
  <span id="live" title="数据库变化后自动刷新">●</span>
</header>

<main id="timeline-view">
  <section id="tracks-wrap">
    <div id="layer-names"></div>
    <div id="scroller">
      <div id="ruler"></div>
      <div id="tracks"></div>
      <div id="playhead"></div>
    </div>
  </section>
  <aside id="now">
    <h2>此刻 <span id="now-time"></span></h2>
    <div id="now-list"><p class="hint">点时间轴上的任意位置，查看那一刻每层都有什么；点色块查看对象详情。</p></div>
  </aside>
</main>

<main id="assets-view" hidden>
  <div id="filters">
    <button data-kind="all" class="on">全部</button>
    <button data-kind="image">图片</button>
    <button data-kind="video">视频</button>
    <button data-kind="audio">音频</button>
    <button data-kind="text">文字</button>
  </div>
  <div id="grid"></div>
</main>

<p id="message" hidden></p>
<script type="module" src="app.js"></script>
</body>
</html>
